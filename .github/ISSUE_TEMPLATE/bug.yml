name: Bug report
description: Report a reproducible runtime, policy or connector defect
body:
  - type: textarea
    attributes: {label: Reproduction, description: Include the smallest Agent Card, input and command that reproduce the issue.}
    validations: {required: true}
  - type: textarea
    attributes: {label: Expected governance outcome}
    validations: {required: true}
  - type: textarea
    attributes: {label: Environment, description: InfraAgentKit, Python and operating-system versions.}
    validations: {required: true}
