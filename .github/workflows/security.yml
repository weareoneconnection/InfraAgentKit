name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pip-audit bandit cyclonedx-bom
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r infraagentkit -x tests
      - run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with: {name: infraagentkit-sbom, path: sbom.json}
