name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m compileall -q infraagentkit servers
      - run: infra-agent doctor
      - run: infra-agent validate examples/agents/*.yaml
      - run: pytest -q
      - run: python evals/run_benchmark.py
      - run: infra-agent connector-validate examples/connectors/project-snapshot.json
