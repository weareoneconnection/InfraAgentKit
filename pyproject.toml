[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infraagentkit"
version = "3.0.0"
description = "30-agent governed collaboration and MCP framework for the transport infrastructure lifecycle"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<9", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=2,<3"]

[project.scripts]
infra-agent = "infraagentkit.cli:main"

[tool.setuptools.packages.find]
include = ["infraagentkit*"]

[tool.setuptools.package-data]
infraagentkit = ["packs/*.yaml", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
