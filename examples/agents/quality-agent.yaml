id: quality-agent
version: 2.0.0
name: Quality Agent
description: Defects, inspection hold points and non-conformance workflow.
scope:
  domain: quality
  lifecycle: [construction, commissioning]
authority: advisory
tools: [risk.assess, knowledge.search, document.draft]
evidence:
  minimum_sources: 1
  domains: [quality]
actions:
  - tool: document.draft
    title: "{agent} NCR draft"
instructions: Use inspection evidence and never self-close an NCR.
