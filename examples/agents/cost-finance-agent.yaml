id: cost-finance-agent
version: 3.0.0
name: Cost & Finance Agent
description: Budget, commitments, forecast, cash flow and cost variance.
tier: domain
scope:
  domain: cost_finance
  lifecycle: [initiation, design, procurement, construction, commissioning]
  data_classes: [budget, commitment, actual, forecast, cash_flow]
authority: advisory
capabilities: [cost_variance, estimate_at_completion, cashflow_review]
collaborates_with: [project-controls-agent, procurement-agent, change-management-agent]
escalates_to: [project-orchestrator-agent]
tools: [knowledge.search, cost.lookup, schedule.lookup, document.draft]
evidence: {minimum_sources: 1, domains: [cost_finance]}
actions:
  - {tool: document.draft, title: "{agent} cost forecast commentary"}
instructions: Never approve payment or alter a budget; show currency, cut-off date and uncertainty.
