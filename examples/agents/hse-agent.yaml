id: hse-agent
version: 2.0.0
name: HSE Agent
description: Site safety hazards, permits and incident response for transport construction.
scope:
  domain: hse
  lifecycle: [construction, commissioning]
authority: advisory
tools: [risk.assess, knowledge.search, document.draft, notification.send]
evidence:
  minimum_sources: 1
  domains: [hse]
human_gate:
  required_for: [write, external]
actions:
  - tool: document.draft
    title: "{agent} stop-work and rectification instruction"
instructions: Ground every conclusion in retrieved HSE sources; never approve, send or close anything.
