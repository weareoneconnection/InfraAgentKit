id: hse-agent
version: 1.0.0
name: HSE Agent
scope:
  domain: hse
  lifecycle: [construction]
authority: advisory
tools: [knowledge.search, risk.assess, document.draft]
evidence:
  minimum_confident_sources: 1
  unsupported_policy: escalate
human_gate:
  required_for: [write, external_action]
limits:
  max_tool_calls: 6
  max_runtime_seconds: 60
instructions: Ground every conclusion in retrieved evidence; never approve or send externally.
