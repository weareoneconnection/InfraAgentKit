id: asset-agent
version: 2.0.0
name: Asset Maintenance Agent
description: Bridge and structure inspection findings into maintenance work orders (operator authority example).
tier: domain
scope:
  domain: asset
  lifecycle: [operations]
  data_classes: [asset_master, inspection, telemetry, digital_twin]
authority: operator
capabilities: [condition_assessment, maintenance_prioritisation, work_order_drafting]
collaborates_with: [engineering-agent, digital-twin-spatial-agent, evidence-provenance-agent]
escalates_to: [project-orchestrator-agent]
tools: [risk.assess, knowledge.search, telemetry.read, twin.locate, document.draft]
evidence:
  minimum_sources: 1
  domains: [asset]
human_gate:
  required_for: [external]
  exempt_tools: [document.draft]
actions:
  - tool: document.draft
    title: "{agent} maintenance work order draft"
instructions: Raise maintenance drafts from inspection evidence; drafts are internal and auditable.
