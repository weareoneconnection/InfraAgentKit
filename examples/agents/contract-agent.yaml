id: contract-agent
version: 1.0.0
name: Contract Agent
scope:
  domain: contract
  lifecycle: [procurement, construction]
authority: advisory
tools: [knowledge.search, document.draft]
evidence:
  minimum_confident_sources: 1
  unsupported_policy: escalate
human_gate:
  required_for: [write, external_action]
limits:
  max_tool_calls: 6
  max_runtime_seconds: 60
instructions: Never concede liability, cost or time without human authority.
