id: plant-agent
version: 2.0.0
name: Plant & Lifting Agent
description: Lifting plans, crane and rigging certification readiness.
scope:
  domain: plant
  lifecycle: [construction]
authority: advisory
tools: [risk.assess, knowledge.search, document.draft, notification.send]
evidence:
  minimum_sources: 1
  domains: [plant]
actions:
  - tool: document.draft
    title: "{agent} lifting readiness checklist"
  - tool: notification.send
    title: "{agent} lifting supervisor alert"
instructions: A lift may proceed only with an approved plan and certified equipment.
