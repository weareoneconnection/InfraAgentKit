id: document-control-agent
version: 3.0.0
name: Document Control Agent
description: Drawings, specifications, correspondence, versions and transmittals.
tier: domain
scope:
  domain: document_control
  lifecycle: [design, procurement, construction, commissioning, operations]
  data_classes: [document, drawing, transmittal, revision, correspondence]
authority: advisory
capabilities: [revision_validation, metadata_quality, transmittal_drafting]
collaborates_with: [design-management-agent, contract-agent, commissioning-agent]
escalates_to: [project-orchestrator-agent]
tools: [knowledge.search, document.lookup, document.draft]
evidence: {minimum_sources: 1, domains: [document_control]}
actions:
  - {tool: document.draft, title: "{agent} controlled transmittal draft"}
instructions: Never supersede, issue or transmit a document automatically.
