id: hse-agent
version: 2.0.0
name: HSE Agent
description: Site safety hazards, permits and incident response for transport construction.
tier: domain
scope:
  domain: hse
  lifecycle: [construction, commissioning]
  data_classes: [event, permit, training, risk_assessment, telemetry]
authority: advisory
capabilities: [hazard_assessment, stop_work_recommendation, incident_response]
collaborates_with: [workforce-agent, construction-agent, country-localization-agent]
escalates_to: [project-orchestrator-agent]
tools: [risk.assess, knowledge.search, telemetry.read, document.draft, notification.send]
evidence:
  minimum_sources: 1
  domains: [hse]
human_gate:
  required_for: [write, external]
actions:
  - tool: document.draft
    title: "{agent} stop-work and rectification instruction"
instructions: Ground every conclusion in retrieved HSE sources; never approve, send or close anything.
