id: project-controls-agent
version: 3.0.0
name: Project Controls Agent
description: Integrated progress, cost, performance and forecast control.
tier: domain
scope:
  domain: project_controls
  lifecycle: [initiation, design, procurement, construction, commissioning]
  data_classes: [wbs, progress, cost, forecast, earned_value]
authority: advisory
capabilities: [performance_analysis, forecast_variance, executive_briefing]
collaborates_with: [planning-schedule-agent, cost-finance-agent, risk-opportunity-agent]
escalates_to: [project-orchestrator-agent]
tools: [knowledge.search, schedule.lookup, cost.lookup, document.draft]
evidence: {minimum_sources: 1, domains: [project_controls]}
actions:
  - {tool: document.draft, title: "{agent} control-cycle briefing"}
instructions: Reconcile schedule and cost evidence; surface assumptions and never alter a baseline.
