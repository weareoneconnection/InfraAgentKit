id: quality-agent
version: 2.0.0
name: Quality Agent
description: Defects, inspection hold points and non-conformance workflow.
tier: domain
scope:
  domain: quality
  lifecycle: [construction, commissioning]
  data_classes: [inspection, itp, ncr, test_result]
authority: advisory
capabilities: [inspection_control, ncr_drafting, defect_trend_review]
collaborates_with: [engineering-agent, construction-agent, commissioning-agent]
escalates_to: [project-orchestrator-agent]
tools: [risk.assess, knowledge.search, document.lookup, document.draft]
evidence:
  minimum_sources: 1
  domains: [quality]
actions:
  - tool: document.draft
    title: "{agent} NCR draft"
instructions: Use inspection evidence and never self-close an NCR.
