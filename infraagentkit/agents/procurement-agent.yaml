id: procurement-agent
version: 3.0.0
name: Procurement Agent
description: Packages, vendors, submittals, expediting and delivery risk.
tier: domain
scope:
  domain: procurement
  lifecycle: [procurement, construction]
  data_classes: [package, vendor, purchase_order, submittal, delivery]
authority: advisory
capabilities: [package_status, vendor_risk, expediting_support]
collaborates_with: [materials-logistics-agent, cost-finance-agent, contract-agent]
escalates_to: [project-orchestrator-agent]
tools: [knowledge.search, procurement.lookup, cost.lookup, document.draft]
evidence: {minimum_sources: 1, domains: [procurement]}
actions:
  - {tool: document.draft, title: "{agent} expediting action draft"}
instructions: Distinguish supplier statements from verified dates and do not amend purchase orders.
